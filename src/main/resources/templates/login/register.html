<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    </head>
    <body>
        
        <div th:insert = "~{login/login::header}"></div>

        <form th:action="@{/register/new-user}" method="post">
            <!-- 2 column grid layout with text inputs for the first and last names -->
            <div class="row mb-4">
                <div class="col">
                    <div class="form-outline">
                        <input type="text" id="firtsname" name="firtsname" class="form-control" required/>
                        <label class="form-label" for="firtsname">First name</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-outline">
                        <input type="text" id="lastname" name="lastname" class="form-control" required/>
                        <label class="form-label" for="lastname">Last name</label>
                    </div>
                </div>
            </div>

            <!-- Text input -->
            <div class="form-outline mb-4">
                <input type="text" id="username" name="username" class="form-control" required/>
                <label class="form-label" for="username">Username</label>
            </div>

            <!-- Text input -->
            <div class="form-outline mb-4">
                <input type="text" id="address" name="address" class="form-control" required/>
                <label class="form-label" for="address">Address</label>
            </div>

            <!-- Email input -->
            <div class="form-outline mb-4">
                <input type="email" id="email" name="email" class="form-control" required/>
                <label class="form-label" for="email">Email</label>
            </div>

            <!-- Number input -->
            <div class="form-outline mb-4">
                <input type="number" id="cellphone" name="cellphone" class="form-control" required/>
                <label class="form-label" for="cellphone">Phone</label>
            </div>

            <!-- Message input -->
            <div class="form-outline mb-4">
                <input type="password"  id="password" name="password" class="form-control" required/>
                <label class="form-label" for="password">Password</label>
            </div>
            
            <!-- Submit button -->
            <button type="submit" class="btn btn-primary btn-block mb-4">Registrar</button>
        </form>

    </body>
</html>
